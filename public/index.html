<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 360 Appraisal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="login-container glass-panel fade-in">
        <div class="login-header">
            <h1>HR 360°</h1>
            <p>Employee Appraisal System</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required
                    autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <span style="display:flex; align-items:center; gap:8px;"><i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Sign In</span>
                <div class="loader hidden"></div>
            </button>
            <div id="errorMsg" class="error-message hidden"></div>
        </form>
    </div>
    <script src="client.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
